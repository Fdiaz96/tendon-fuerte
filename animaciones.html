<!doctype html>
<!-- Página temporal para revisar todas las animaciones juntas. Se borra cuando terminemos de ajustarlas. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de animaciones</title>
  <style>
    body { margin: 0; padding: 12px; background: #0E0F11; color: #E8EAED; font: 14px system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 4px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    figure { margin: 0; background: #1A1C20; border-radius: 12px; overflow: hidden; }
    svg { width: 100%; display: block; background: #F4F5F7; }
    figcaption { padding: 6px 8px 8px; line-height: 1.3; }
    figcaption b { display: block; }
    figcaption span { color: #9AA0A6; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Todas las animaciones (<span id="n"></span>)</h1>
  <div class="grid" id="grid"></div>
  <script src="data.js"></script>
  <script src="figures.js"></script>
  <script>
    const ids = Object.keys(EXERCISES);
    document.getElementById('n').textContent = ids.length;
    document.getElementById('grid').innerHTML = ids.map((id, i) => {
      const ex = EXERCISES[id], svg = figureSVG(ex);
      return `<figure>${svg}<figcaption><b>${i + 1}. ${ex.name}</b><span>${id} · cámara ${CAM.yaw}° · ${(ex.mus || []).map((m) => MUSCLE_NAMES[m]).join(', ')}</span></figcaption></figure>`;
    }).join('');
  </script>
</body>
</html>
